<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 활용 수준 진단</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --lime:#A3E635;--lime-dim:rgba(163,230,53,0.12);
  --purple:#7C3AED;--purple-dim:rgba(124,58,237,0.15);
  --bg:#030303;--card:#1E293B;--card2:#293548;
  --text:#F1F5F9;--muted:#94A3B8;--border:rgba(255,255,255,0.08);
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.wrap{width:100%;max-width:480px}

/* SHAPES */
.hero-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.hero-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 40%,rgba(163,230,53,0.04) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 70%,rgba(124,58,237,0.05) 0%,transparent 60%);}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(3,3,3,0.7) 0%,transparent 20%,transparent 80%,rgba(3,3,3,0.9) 100%);}
.shape{position:absolute;border-radius:9999px;border:1.5px solid rgba(255,255,255,0.12);animation:floatIn var(--fi-dur,2.4s) var(--fi-delay,0s) cubic-bezier(0.23,0.86,0.39,0.96) both,floatY 12s var(--fy-delay,0s) ease-in-out infinite;}
@keyframes floatIn{from{opacity:0;transform:translateY(-120px) rotate(calc(var(--rot,0deg) - 15deg))}to{opacity:1;transform:translateY(0) rotate(var(--rot,0deg))}}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(15px) rotate(var(--rot,0deg))}}
.s1{--rot:12deg;--fi-delay:.3s;--fy-delay:0s;width:min(600px,130vw);height:140px;left:-10%;top:20%;background:linear-gradient(to right,rgba(163,230,53,0.14),transparent);}
.s2{--rot:-15deg;--fi-delay:.5s;--fy-delay:2s;width:min(500px,110vw);height:120px;right:-5%;top:70%;background:linear-gradient(to right,rgba(124,58,237,0.15),transparent);}
.s3{--rot:-8deg;--fi-delay:.4s;--fy-delay:4s;width:300px;height:80px;left:5%;bottom:12%;background:linear-gradient(to right,rgba(139,92,246,0.14),transparent);}
.s4{--rot:20deg;--fi-delay:.6s;--fy-delay:1s;width:200px;height:60px;right:15%;top:12%;background:linear-gradient(to right,rgba(163,230,53,0.12),transparent);}
.s5{--rot:-25deg;--fi-delay:.7s;--fy-delay:3s;width:150px;height:40px;left:22%;top:8%;background:linear-gradient(to right,rgba(99,102,241,0.15),transparent);}

/* INTRO */
.intro{position:relative;z-index:10;text-align:center;padding:40px 24px;animation:fadeUp 1s .5s cubic-bezier(0.25,0.4,0.25,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-flex;align-items:center;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);font-size:13px;letter-spacing:.08em;padding:7px 16px;border-radius:100px;margin-bottom:32px;}
.badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#A3E635;margin-right:8px;}
.intro h1{font-size:clamp(28px,7vw,48px);font-weight:700;line-height:1.25;margin-bottom:16px;letter-spacing:-.02em;animation:fadeUp 1s .7s both;}
.grad-white{background:linear-gradient(to bottom,#fff,rgba(255,255,255,0.8));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.grad-lime{background:linear-gradient(to right,#A3E635,rgba(255,255,255,0.9),#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.intro p{color:rgba(255,255,255,0.4);font-size:15px;line-height:1.75;margin-bottom:36px;font-weight:300;letter-spacing:.03em;animation:fadeUp 1s .9s both;}
.info-row{display:flex;gap:10px;margin-bottom:36px;justify-content:center;animation:fadeUp 1s 1.1s both;}
.info-chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.info-chip strong{color:var(--text)}
.btn-start{width:100%;background:var(--lime);color:#0a0a0a;font-size:17px;font-weight:700;border:none;border-radius:14px;padding:18px;cursor:pointer;transition:opacity .15s,transform .1s;font-family:'Noto Sans KR',sans-serif;animation:fadeUp 1s 1.2s both;}
.btn-start:hover{opacity:.88}.btn-start:active{transform:scale(.98)}

/* PROGRESS */
.progress-area{margin-bottom:24px;position:relative;z-index:10;}
.progress-top{display:flex;justify-content:space-between;margin-bottom:10px}
.q-num{font-size:13px;color:var(--muted)}.q-num strong{color:var(--lime)}
.progress-bar{height:3px;background:rgba(255,255,255,0.08);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--lime);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* QUESTION */
.q-area{background:rgba(30,41,59,0.7);border:1px solid var(--border);border-radius:20px;padding:28px 22px 22px;position:relative;z-index:10;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.q-tag{display:inline-block;background:rgba(124,58,237,0.18);color:#A78BFA;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.06em;margin-bottom:16px;border:1px solid rgba(124,58,237,0.25);}
.q-text{font-size:17px;font-weight:500;line-height:1.65;margin-bottom:22px}
.options{display:flex;flex-direction:column;gap:9px}
.opt{background:rgba(41,53,72,0.8);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;text-align:left;font-family:'Noto Sans KR',sans-serif;color:rgba(241,245,249,0.85);}
.opt:hover{border-color:rgba(163,230,53,0.5);background:rgba(163,230,53,0.07);}
.opt:active{transform:scale(.98)}.opt.selected{border-color:var(--lime);background:rgba(163,230,53,0.1);color:var(--text);}

/* LOADING */
.loading{position:relative;z-index:10;text-align:center;padding:80px 24px;}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:dotBounce 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dotBounce{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1.2);opacity:1}}
.loading p{color:var(--muted);font-size:15px}

/* RESULT */
.result{position:relative;z-index:10;text-align:center;padding:8px 0;animation:fadeUp .6s ease both;}
.result-badge{display:inline-block;background:var(--lime);color:#0a0a0a;font-size:12px;font-weight:700;padding:7px 18px;border-radius:100px;margin-bottom:24px;letter-spacing:.06em;}
.result-card{background:rgba(30,41,59,0.75);border:1px solid var(--border);border-radius:20px;padding:28px 22px;margin-bottom:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;position:relative;}
.result-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:20px 20px 0 0;}
.result-icon{font-size:52px;margin:16px 0 12px;display:block}
.result-level{font-size:26px;font-weight:700;margin-bottom:6px}
.result-sublabel{color:var(--muted);font-size:14px;margin-bottom:16px}
.result-score{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:100px;padding:6px 16px;font-size:14px;color:var(--muted);margin-bottom:20px;}
.result-score strong{font-size:20px;font-weight:700}
.result-keyword{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center;}
.kw{background:var(--lime-dim);border:1px solid rgba(163,230,53,0.25);color:var(--lime);font-size:12px;font-weight:500;padding:5px 12px;border-radius:8px;}
.result-desc{font-size:14px;line-height:1.75;color:rgba(255,255,255,0.5);text-align:left;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);}
.result-desc strong{color:rgba(255,255,255,0.8);display:block;margin-bottom:8px;font-size:15px;}

/* 강사 안내 */
.show-instructor{background:var(--purple-dim);border:1px solid rgba(124,58,237,0.25);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.show-instructor .icon{font-size:22px;flex-shrink:0}
.show-instructor p{font-size:14px;color:#C4B5FD;line-height:1.5;text-align:left}
.show-instructor p strong{color:#A78BFA;display:block;margin-bottom:2px;font-size:13px}

/* 버튼 그룹 */
.btn-group{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
.btn-kakao{
  width:100%;background:#FEE500;color:#191919;
  font-size:16px;font-weight:700;border:none;border-radius:14px;
  padding:16px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .15s,transform .1s;
}
.btn-kakao:hover{opacity:.9}.btn-kakao:active{transform:scale(.98)}
.kakao-icon{width:22px;height:22px;display:inline-block;vertical-align:middle;}
.btn-share{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
  color:var(--text);font-size:15px;font-weight:500;border-radius:14px;
  padding:14px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s;
}
.btn-share:hover{background:rgba(255,255,255,0.1)}
.btn-retry{width:100%;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted);font-size:14px;border-radius:14px;padding:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:border-color .15s;}
.btn-retry:hover{border-color:rgba(255,255,255,0.2)}

/* 토스트 */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,41,59,0.95);border:1px solid var(--border);color:var(--text);font-size:14px;padding:12px 20px;border-radius:100px;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;backdrop-filter:blur(12px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="hero-bg">
  <div class="shape s1"></div><div class="shape s2"></div>
  <div class="shape s3"></div><div class="shape s4"></div><div class="shape s5"></div>
</div>

<div class="wrap">

  <!-- INTRO -->
  <div class="intro" id="intro">
    <div class="badge"><span class="badge-dot"></span>AI 활용 수준 진단</div>
    <h1><span class="grad-white">나는 AI를</span><br><span class="grad-lime">얼마나 활용하고 있을까?</span></h1>
    <p>10가지 일상·업무 상황에서<br>나의 실제 반응을 선택하세요.<br>AI 활용 수준을 4단계로 진단해 드립니다.</p>
    <div class="info-row">
      <div class="info-chip">⏱ <strong>3분</strong> 소요</div>
      <div class="info-chip">📋 <strong>10문항</strong></div>
      <div class="info-chip">🎯 <strong>4단계</strong> 결과</div>
    </div>
    <button class="btn-start" onclick="startQuiz()">진단 시작하기 →</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="progress-area">
      <div class="progress-top">
        <span class="q-num">질문 <strong id="cur">1</strong> / 10</span>
        <span class="q-num" id="pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="fill" style="width:0%"></div></div>
    </div>
    <div class="q-area">
      <span class="q-tag" id="qtag">상황</span>
      <p class="q-text" id="qtext"></p>
      <div class="options" id="opts"></div>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loading" class="loading hidden">
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <p>결과를 분석하는 중...</p>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="result">
      <div class="result-badge">✦ 진단 완료</div>
      <div class="result-card">
        <div class="result-accent" id="r-accent"></div>
        <span class="result-icon" id="r-icon"></span>
        <div class="result-level" id="r-level"></div>
        <div class="result-sublabel" id="r-sub"></div>
        <div class="result-score">총점 <strong id="r-score"></strong> / 40점</div>
        <div class="result-keyword" id="r-kw"></div>
        <div class="result-desc" id="r-desc"></div>
      </div>
      <div class="show-instructor">
        <span class="icon">📱</span>
        <p><strong>강사에게 보여주세요</strong>이 화면을 강사에게 제시하면 맞춤 학습 안내를 받을 수 있습니다.</p>
      </div>
      <div class="btn-group">
        <button class="btn-kakao" onclick="shareKakao()">
          <svg class="kakao-icon" viewBox="0 0 24 24" fill="#191919"><path d="M12 3C6.477 3 2 6.477 2 10.8c0 2.7 1.6 5.1 4 6.6l-1 3.6 4.2-2.8c.9.2 1.8.2 2.8.2 5.523 0 10-3.477 10-7.8S17.523 3 12 3z"/></svg>
          카카오톡으로 결과 공유하기
        </button>
        <button class="btn-share" onclick="shareNative()">
          🔗 다른 방법으로 공유하기
        </button>
        <button class="btn-retry" onclick="reset()">🔄 다시 진단하기</button>
      </div>
    </div>
  </div>

</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
const Qs=[
  {tag:"문서 작성",text:"업무 중 비슷한 형식의 보고서를 반복해서 작성해야 할 때, 나는?",opts:["매번 처음부터 직접 작성한다","예전 파일을 복사해서 수정한다","AI 도구에 내용을 입력해 초안을 받아본 적이 있다","AI로 초안을 만들고, 내가 검토·수정하는 흐름이 정착되어 있다"]},
  {tag:"정보 검색",text:"새로운 업무나 주제에 대해 빠르게 파악해야 할 때, 나는?",opts:["네이버·구글에서 검색하거나 지인에게 물어본다","ChatGPT나 다른 AI에 질문해본 적이 있다","AI에 질문하되, 답변의 정확성을 다른 자료로 확인한다","AI에게 구조화된 질문을 던져 원하는 깊이의 정보를 얻는다"]},
  {tag:"이메일·메시지",text:"정중하지만 단호하게 거절하는 이메일을 써야 할 때, 나는?",opts:["오래 고민하며 직접 쓴다","AI 도구를 써보고 싶지만 어떻게 써야 할지 모르겠다","AI에게 상황 설명 후 초안을 받아 내용을 수정한다","AI에게 역할·맥락·조건을 구체적으로 주고 바로 쓸 수 있는 결과물을 얻는다"]},
  {tag:"자료 요약",text:"30페이지 분량의 문서를 핵심만 파악해야 할 때, 나는?",opts:["처음부터 끝까지 직접 읽는다","AI로 요약이 가능하다는 건 알지만 써본 적은 없다","문서를 AI에 붙여넣어 요약을 받아봤다","요약 → 핵심 질문 → 심층 확인의 순서로 AI와 대화하며 분석한다"]},
  {tag:"아이디어 발상",text:"기획안이나 콘텐츠 아이디어가 필요할 때, 나는?",opts:["혼자 생각하거나 동료와 브레인스토밍한다","AI가 아이디어를 준다는 건 알지만 결과가 뻔할 것 같아 안 쓴다","AI에게 아이디어를 요청하고 그중 좋은 것을 골라 발전시킨다","AI와 여러 차례 대화하며 아이디어를 구체화하고 검증한다"]},
  {tag:"반복 업무",text:"매주 같은 형식의 데이터를 정리·보고해야 할 때, 나는?",opts:["매번 수작업으로 정리한다","엑셀 함수 정도는 쓰지만 AI 연동은 생각 못 해봤다","AI로 자동화 방법을 찾아보거나 시도해본 적이 있다","AI·자동화 도구를 연결해 반복 작업을 크게 줄여놨다"]},
  {tag:"AI 도구 인식",text:"요즘 새로운 AI 도구가 나왔다는 소식을 들었을 때, 나는?",opts:["관심 없거나 어렵게 느껴진다","흥미롭긴 한데 어떻게 써야 할지 모르겠다","일단 써보고 내 업무에 쓸 수 있을지 확인한다","어떤 업무에 적용할지 바로 떠오르고 실험해본다"]},
  {tag:"SNS·콘텐츠",text:"홍보용 글이나 SNS 게시물을 만들어야 할 때, 나는?",opts:["직접 생각해서 쓴다","AI로 만들 수 있다는 건 알지만 어색할 것 같아 망설인다","AI 초안을 받아 내 스타일에 맞게 다듬어 사용한다","AI에게 타깃·톤·목적을 명확히 주고 바로 활용 가능한 결과를 얻는다"]},
  {tag:"문제 해결",text:"업무 중 낯선 문제나 오류가 생겼을 때, 나는?",opts:["구글 검색이나 주변 도움으로 해결한다","AI에 물어볼 수 있다는 건 알지만 어떻게 질문해야 할지 모른다","AI에게 상황을 설명하고 해결 방법을 찾아본다","AI와 단계적으로 원인을 좁혀가며 효율적으로 해결한다"]},
  {tag:"AI에 대한 태도",text:"AI가 내 직업이나 역할을 대체할 수 있다는 이야기를 들을 때, 나는?",opts:["불안하거나 거부감이 든다","걱정되지만 어떻게 대응해야 할지 모르겠다","AI를 배워서 내 능력을 보완해야 한다고 생각하고 공부 중이다","AI를 활용해 나만의 경쟁력을 이미 만들어가고 있다"]}
];

const LEVELS=[
  {min:10,max:17,icon:"🌱",level:"입문형",sublabel:"AI가 낯선 단계",color:"#94A3B8",
   desc:"<strong>입문형이란?</strong>아직 AI 도구가 낯설거나 막연하게 느껴지는 단계입니다. 지금이 시작할 가장 좋은 타이밍이에요.",
   kws:["AI 첫걸음","관심 시작","디지털 전환 준비"]},
  {min:18,max:25,icon:"🌿",level:"기초형",sublabel:"AI를 알지만 본격 활용 전 단계",color:"#60A5FA",
   desc:"<strong>기초형이란?</strong>AI 도구의 존재는 알고 있지만 실제 업무에 자신 있게 쓰지는 못하는 단계입니다. 작은 시도 하나가 큰 전환점이 됩니다.",
   kws:["기초 사용","도구 탐색","활용 준비"]},
  {min:26,max:33,icon:"🌳",level:"실무형",sublabel:"AI를 업무에 활용하기 시작한 단계",color:"#A3E635",
   desc:"<strong>실무형이란?</strong>일부 업무에서 AI를 적극적으로 활용하고 있습니다. 프롬프트 설계와 업무 흐름 연결을 다듬으면 생산성이 크게 올라갑니다.",
   kws:["실무 적용","프롬프트 설계","워크플로우 연결"]},
  {min:34,max:40,icon:"🚀",level:"전문형",sublabel:"AI를 일상·업무에 적극 적용하는 단계",color:"#A78BFA",
   desc:"<strong>전문형이란?</strong>AI를 단순 도구가 아닌 업무 파트너로 활용하고 있습니다. 자동화·프롬프트 엔지니어링까지 체계를 갖춘 상위 활용자입니다.",
   kws:["AI 자동화","프롬프트 엔지니어링","AX 선도자"]}
];

let cur=0,score=0,currentLevel=null;
const PAGE_URL=location.href;

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQ();
}

function renderQ(){
  const q=Qs[cur];
  document.getElementById('cur').textContent=cur+1;
  const pct=Math.round((cur/10)*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('qtag').textContent=q.tag;
  document.getElementById('qtext').textContent=q.text;
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  q.opts.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=t;
    b.onclick=()=>pick(i+1,b);
    opts.appendChild(b);
  });
}

function pick(val,el){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  setTimeout(()=>{score+=val;cur++;cur<10?renderQ():showLoading();},320);
}

function showLoading(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('loading').classList.remove('hidden');
  setTimeout(showResult,1600);
}

function showResult(){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  currentLevel=LEVELS.find(l=>score>=l.min&&score<=l.max)||LEVELS[3];
  document.getElementById('r-accent').style.background=currentLevel.color;
  document.getElementById('r-icon').textContent=currentLevel.icon;
  document.getElementById('r-level').innerHTML=`<span style="color:${currentLevel.color}">${currentLevel.level}</span>`;
  document.getElementById('r-sub').textContent=currentLevel.sublabel;
  document.getElementById('r-score').style.color=currentLevel.color;
  document.getElementById('r-score').textContent=score;
  document.getElementById('r-kw').innerHTML=currentLevel.kws.map(k=>`<span class="kw">${k}</span>`).join('');
  document.getElementById('r-desc').innerHTML=currentLevel.desc;
}

function shareKakao(){
  if(!currentLevel)return;
  const msg=`나의 AI 활용 수준은 "${currentLevel.level}" (${score}점/40점)!\n${currentLevel.sublabel}\n\n나도 진단해보기 👉 ${PAGE_URL}`;
  // 카카오톡 앱 스킴 시도 → 실패 시 클립보드 복사
  const kakaoUrl=`kakaotalk://msg/send?text=${encodeURIComponent(msg)}`;
  const start=Date.now();
  const fallback=setTimeout(()=>{
    copyToClipboard(msg);
    showToast('📋 카카오톡 앱이 없어 클립보드에 복사했어요!');
  },1200);
  window.location.href=kakaoUrl;
  window.addEventListener('blur',()=>{clearTimeout(fallback);},{ once:true });
  window.addEventListener('focus',()=>{
    if(Date.now()-start<1500)clearTimeout(fallback);
  },{ once:true });
}

function shareNative(){
  if(!currentLevel)return;
  const text=`나의 AI 활용 수준은 "${currentLevel.level}" (${score}점/40점)!\n${currentLevel.sublabel}`;
  if(navigator.share){
    navigator.share({title:'AI 활용 수준 진단 결과',text,url:PAGE_URL}).catch(()=>{});
  } else {
    copyToClipboard(text+'\n\n진단하기: '+PAGE_URL);
    showToast('🔗 링크가 클립보드에 복사되었어요!');
  }
}

function copyToClipboard(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).catch(()=>legacyCopy(text));
  } else { legacyCopy(text); }
}
function legacyCopy(text){
  const el=document.createElement('textarea');
  el.value=text;el.style.position='fixed';el.style.opacity='0';
  document.body.appendChild(el);el.select();
  document.execCommand('copy');document.body.removeChild(el);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

function reset(){
  cur=0;score=0;currentLevel=null;
  ['quiz','loading','result'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('intro').classList.remove('hidden');
}
</script>
