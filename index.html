<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 활용 수준 진단</title>
<meta name="description" content="10가지 일상·업무 상황에서 나의 AI 활용 수준을 4단계로 진단합니다.">
<meta name="theme-color" content="#A3E635">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 수준 진단">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F172A'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='16' fill='%23A3E635'%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://developers.kakao.com/sdk/js/kakao.min.js" onerror="window._kakaoFailed=true"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --lime:#A3E635;
  --lime-dark:#84CC16;
  --lime-dim:rgba(163,230,53,0.12);
  --purple:#7C3AED;
  --purple-dim:rgba(124,58,237,0.15);
  --bg:#0F172A;
  --card:#1E293B;
  --card2:#293548;
  --text:#F1F5F9;
  --muted:#94A3B8;
  --border:rgba(255,255,255,0.08);
}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.wrap{width:100%;max-width:480px}

/* ── INTRO ── */
.intro{text-align:center;padding:40px 24px}
.intro .badge{
  display:inline-block;
  background:var(--lime-dim);
  color:var(--lime);
  font-size:12px;font-weight:700;
  padding:6px 14px;border-radius:100px;
  letter-spacing:.08em;margin-bottom:28px;
  border:1px solid rgba(163,230,53,0.3);
}
.intro h1{font-size:26px;font-weight:700;line-height:1.4;margin-bottom:12px}
.intro h1 span{color:var(--lime)}
.intro p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:32px}
.info-row{display:flex;gap:12px;margin-bottom:32px;justify-content:center}
.info-chip{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 16px;
  font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:7px;
}
.info-chip strong{color:var(--text)}
.info-chip svg{flex-shrink:0;opacity:.7}
.btn-start{
  width:100%;
  background:var(--lime);
  color:#0F172A;
  font-size:17px;font-weight:700;
  border:none;border-radius:14px;
  padding:18px;cursor:pointer;
  transition:opacity .15s,transform .1s;
  font-family:'Noto Sans KR',sans-serif;
}
.btn-start:hover{opacity:.9}
.btn-start:active{transform:scale(.98)}

/* ── PROGRESS ── */
.progress-area{margin-bottom:28px}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-num{font-size:13px;color:var(--muted)}
.q-num strong{color:var(--lime)}
.progress-bar{height:4px;background:var(--card2);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--lime);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── QUESTION ── */
.q-area{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 24px 24px;
}
.q-tag{
  display:inline-block;
  background:var(--purple-dim);
  color:#A78BFA;
  font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:6px;
  letter-spacing:.06em;margin-bottom:16px;
}
.q-text{font-size:17px;font-weight:500;line-height:1.6;margin-bottom:24px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  background:var(--card2);
  border:1.5px solid transparent;
  border-radius:12px;
  padding:14px 16px;
  font-size:15px;line-height:1.5;
  cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;
  text-align:left;
  font-family:'Noto Sans KR',sans-serif;
  color:var(--text);
}
.opt:hover{border-color:rgba(163,230,53,0.5);background:rgba(163,230,53,0.06)}
.opt:active{transform:scale(.98)}
.opt.selected{border-color:var(--lime);background:rgba(163,230,53,0.1)}

/* ── QUESTION TRANSITION ── */
@keyframes qSlideIn{
  from{opacity:0;transform:translateX(28px)}
  to{opacity:1;transform:translateX(0)}
}
.q-area.q-enter{animation:qSlideIn .3s cubic-bezier(.2,0,.2,1) both}

/* ── LOADING ── */
.loading-wrap{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:380px;gap:18px;text-align:center;padding:24px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner{
  width:56px;height:56px;
  border:4px solid rgba(163,230,53,0.15);
  border-top-color:var(--lime);
  border-radius:50%;
  animation:spin .8s linear infinite;flex-shrink:0;
}
.loading-title{font-size:18px;font-weight:700;color:var(--text)}
.loading-sub{font-size:14px;color:var(--muted);margin-top:-8px}
@keyframes dotPulse{
  0%,80%,100%{opacity:.25;transform:scale(.75)}
  40%{opacity:1;transform:scale(1)}
}
.loading-dots{display:flex;gap:7px;align-items:center;margin-top:4px}
.loading-dots span{
  width:8px;height:8px;background:var(--lime);border-radius:50%;
  animation:dotPulse 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2){animation-delay:.16s}
.loading-dots span:nth-child(3){animation-delay:.32s}

/* ── RESULT ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
#result.r-show .result{animation:fadeUp .45s cubic-bezier(.2,0,.2,1) both}
.result{text-align:center;padding:8px 0}
.result-accent-bar{height:5px;border-radius:100px;margin-bottom:24px;background:var(--lime)}
.result-badge{
  display:inline-block;background:var(--lime);color:#0F172A;
  font-size:13px;font-weight:700;padding:8px 20px;border-radius:100px;margin-bottom:20px;
}
.result-icon{margin-bottom:20px;display:flex;justify-content:center;align-items:center}
.result-level{font-size:28px;font-weight:700;margin-bottom:8px}
.result-score{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--border);
  border-radius:100px;padding:6px 16px;
  font-size:14px;color:var(--muted);margin-bottom:24px;
}
.result-score strong{color:var(--lime);font-size:18px}
.result-desc{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:20px;margin-bottom:14px;
  font-size:15px;line-height:1.7;color:var(--muted);text-align:left;
}
.result-desc strong{color:var(--text);display:block;margin-bottom:8px;font-size:16px}
.result-keyword{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.kw{
  background:var(--lime-dim);border:1px solid rgba(163,230,53,0.3);
  color:var(--lime);font-size:13px;font-weight:500;
  padding:6px 12px;border-radius:8px;
}

/* ── NEXT STEP ── */
.next-step{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:16px 18px;margin-bottom:16px;
  text-align:left;display:flex;align-items:flex-start;gap:12px;
  position:relative;overflow:hidden;
}
.next-step::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--lime);
}
.ns-icon{flex-shrink:0;margin-top:1px;display:flex}
.ns-label{font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.08em;margin-bottom:5px}
.ns-text{font-size:14px;line-height:1.65;color:var(--text)}

/* ── SHARE BUTTONS ── */
.btn-kakao{
  width:100%;background:#FEE500;color:#191919;
  font-size:15px;font-weight:700;border:none;border-radius:14px;
  padding:16px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:opacity .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:9px;
}
.btn-kakao:hover{opacity:.9}
.btn-kakao:active{transform:scale(.98)}
.btn-share-web{
  width:100%;background:var(--card2);color:var(--text);
  font-size:14px;font-weight:500;border:1px solid var(--border);
  border-radius:14px;padding:14px;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:background .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:9px;
}
.btn-share-web:hover{background:rgba(255,255,255,0.06)}
.btn-share-web:active{transform:scale(.98)}
.btn-retry{
  width:100%;background:transparent;color:var(--muted);
  font-size:14px;font-weight:500;border:1px solid var(--border);
  border-radius:14px;padding:14px;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-retry:hover{background:rgba(255,255,255,0.04)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,41,59,.97);border:1px solid rgba(255,255,255,0.12);
  color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;
  padding:12px 22px;border-radius:100px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="badge">✦ AI 활용 수준 진단</div>
  <h1>나는 AI를<br><span>얼마나 활용하고 있을까?</span></h1>
  <p>10가지 일상·업무 상황에서<br>나의 실제 반응을 선택하세요.<br>AI 활용 수준을 4단계로 진단해 드립니다.</p>
  <div class="info-row">
    <div class="info-chip">
      <!-- clock -->
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6"/><polyline points="7.5,4.5 7.5,7.5 9.8,9.8"/></svg>
      <strong>3분</strong> 소요
    </div>
    <div class="info-chip">
      <!-- document -->
      <svg width="13" height="15" viewBox="0 0 13 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="1.5" y="1.5" width="10" height="12" rx="1.5"/><line x1="4" y1="5.5" x2="9" y2="5.5"/><line x1="4" y1="8" x2="9" y2="8"/><line x1="4" y1="10.5" x2="7" y2="10.5"/></svg>
      <strong>10문항</strong>
    </div>
    <div class="info-chip">
      <!-- target -->
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.4"/><circle cx="7.5" cy="7.5" r="3" stroke="currentColor" stroke-width="1.4"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></svg>

<!-- QUIZ -->
<div id="quiz" class="hidden">

  <div class="q-area" id="qarea">
    <span class="q-tag" id="qtag">상황</span>
    <p class="q-text" id="qtext"></p>
    <div class="options" id="opts"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading" class="hidden">
  <div class="loading-wrap">
    <div class="loading-spinner"></div>
    <p class="loading-title">AI 활용 수준 분석 중</p>
    <p class="loading-sub">잠시만 기다려 주세요</p>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="hidden">
  <div class="result">
    <div class="result-accent-bar" id="r-accent"></div>
    <div class="result-badge">✦ 진단 완료</div>
    <div class="result-icon" id="r-icon"></div>
    <div class="result-level" id="r-level"></div>
    <div class="result-score">총점 <strong id="r-score"></strong> / 40점</div>
    <div class="result-desc" id="r-desc"></div>
    <div class="result-keyword" id="r-kw"></div>
    <div class="next-step">
      <span class="ns-icon">

          <path d="M8.5 18.5H13.5" stroke="#A3E635" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M9.5 20.5H12.5" stroke="#A3E635" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <div>

        <div class="ns-text" id="ns-text"></div>
      </div>
    </div>
    <button class="btn-kakao" onclick="shareKakao()">
      <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 2.5C5.858 2.5 2.5 5.19 2.5 8.5c0 2.07 1.23 3.9 3.1 5.01l-.76 2.81c-.05.18.14.33.3.22L8.8 14.6c.38.06.77.1 1.2.1 4.142 0 7.5-2.69 7.5-6s-3.358-6-7.5-6z" fill="#191919"/>
      </svg>

    </button>
    <button class="btn-share-web" onclick="shareWeb()">
      <!-- link icon -->
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6.5 9.5L9.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M7 5.5L8.8 3.7C9.9 2.6 11.7 2.6 12.8 3.7C13.9 4.8 13.9 6.6 12.8 7.7L11 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M9 10.5L7.2 12.3C6.1 13.4 4.3 13.4 3.2 12.3C2.1 11.2 2.1 9.4 3.2 8.3L5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      링크 복사 / 다른 앱으로 공유
    </button>
    <button class="btn-retry" onclick="resetQuiz()">
      <!-- refresh icon -->
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <path d="M12.5 7.5A5 5 0 118 3c1.4 0 2.7.5 3.7 1.4L14 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 3v3.5h-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      다시 진단하기
    </button>
  </div>
</div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ── State ── */
var cur = 0, score = 0, curLv = null;

/* ── Quiz flow ── */
function startQuiz() {
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQ(false);
}

function _renderContent() {
  var q = Qs[cur];
  document.getElementById('cur').textContent = cur + 1;
  var pct = Math.round((cur / 10) * 100);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('qtag').textContent = q.tag;
  document.getElementById('qtext').textContent = q.text;
  var opts = document.getElementById('opts');
  opts.innerHTML = '';
  q.opts.forEach(function (t, i) {
    var b = document.createElement('button');
    b.className = 'opt'; b.textContent = t;
    b.onclick = function () { pick(i + 1, b); };
    opts.appendChild(b);
  });
}

function renderQ(animate) {
  var qa = document.getElementById('qarea');
  if (!animate) { _renderContent(); return; }
  qa.style.transition = 'opacity 0.12s ease';
  qa.style.opacity = '0';
  setTimeout(function () {
    _renderContent();
    qa.style.transition = 'none';
    qa.style.opacity = '1';
    qa.classList.remove('q-enter');
    void qa.offsetWidth;
    qa.classList.add('q-enter');
  }, 130);
}

function pick(val, el) {
  document.querySelectorAll('.opt').forEach(function (o) {
    o.classList.remove('selected'); o.style.pointerEvents = 'none';
  });
  el.classList.add('selected');
  setTimeout(function () {
    score += val; cur++;
    if (cur < 10) {
      document.querySelectorAll('.opt').forEach(function (o) { o.style.pointerEvents = ''; });
      renderQ(true);
    } else {
      showLoading();
    }
  }, 320);
}

/* ── Loading ── */
function showLoading() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('loading').classList.remove('hidden');
  setTimeout(showResult, 1500);
}

/* ── Result ── */
function showResult() {
  document.getElementById('loading').classList.add('hidden');
  var lv = null;
  for (var i = 0; i < LEVELS.length; i++) {
    if (score >= LEVELS[i].min && score <= LEVELS[i].max) { lv = LEVELS[i]; break; }
  }
  if (!lv) lv = LEVELS[LEVELS.length - 1];
  curLv = lv;

  document.getElementById('r-accent').style.background = lv.color;
  document.getElementById('r-icon').innerHTML = lv.icon;
  document.getElementById('r-level').innerHTML =
    '<span style="color:' + lv.color + '">' + lv.level + '형</span> · ' + lv.label;
  document.getElementById('r-score').textContent = score;
  document.getElementById('r-desc').innerHTML =
    '<strong>' + lv.level + '형이란?</strong>' + lv.desc;
  document.getElementById('r-kw').innerHTML =
    lv.kws.map(function (k) { return '<span class="kw">' + k + '</span>'; }).join('');
  document.getElementById('ns-text').textContent = lv.next;
  document.getElementById('fill').style.width = '100%';

  var res = document.getElementById('result');
  res.classList.remove('r-show');
  res.classList.remove('hidden');
  void res.offsetWidth;
  res.classList.add('r-show');
}

/* ── Kakao share ── */
function shareKakao() {
  if (!curLv) return;
  var text = '🤖 AI 활용 수준 진단 결과\n\n나는 AI ' + curLv.level + '형 (' + score + '/40점)!\n' + curLv.label + '\n\n나도 진단받기 👇';
  if (window.Kakao && !window._kakaoFailed && Kakao.isInitialized()) {
    try {
      var obj = {
        objectType: 'text',
        text: text,
        link: { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL }
      };
      if (Kakao.Share && Kakao.Share.sendDefault) {
        Kakao.Share.sendDefault(obj);
      } else if (Kakao.Link && Kakao.Link.sendDefault) {
        Kakao.Link.sendDefault(obj);
      }
      return;
    } catch (e) {}
  }
  shareWeb();
}

/* ── Web share / clipboard ── */
function shareWeb() {
  if (!curLv) return;
  var text = '🤖 AI 활용 수준 진단 결과\n나는 AI ' + curLv.level + '형 (' + score + '/40점)!\n' + curLv.label + '\n\n나도 진단받기 → ' + SHARE_URL;
  if (navigator.share) {
    navigator.share({ title: 'AI 활용 수준 진단', text: text })
      .catch(function (e) { if (e.name !== 'AbortError') copyToClipboard(text); });
  } else {
    copyToClipboard(text);
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function () { showToast('결과가 클립보드에 복사되었습니다!'); })
      .catch(function () { showToast('공유 기능을 지원하지 않는 환경입니다.'); });
  } else {
    showToast('공유 기능을 지원하지 않는 환경입니다.');
  }
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ── Reset ── */
function resetQuiz() {
  cur = 0; score = 0; curLv = null;
  var res = document.getElementById('result');
  res.classList.add('hidden'); res.classList.remove('r-show');
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
}
